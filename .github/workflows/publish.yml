name: Publish

on:
    push:
        tags:
            - "v*.*.*"

concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        if: github.repository == 'infini-scroll/infini'
        name: Publish to npm
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org/
                  package-manager-cache: false

            - name: Install Rust tools
              uses: taiki-e/install-action@v2
              with:
                  tool: rust+wasm32-unknown-unknown,wasm-pack

            - name: Install dependencies
              run: pnpm ci
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

            - name: Verify release version
              id: release
              shell: bash
              run: |
                  node --input-type=module <<'NODE'
                  import { readFileSync, readdirSync } from "node:fs";

                  const version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
                  const semver =
                      /^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;

                  if (!semver.test(version)) {
                      throw new Error(`Tag ${process.env.GITHUB_REF_NAME} is not a valid v-prefixed semver`);
                  }

                  for (const directory of readdirSync("packages")) {
                      const path = `packages/${directory}/package.json`;
                      const manifest = JSON.parse(readFileSync(path, "utf8"));
                      if (manifest.private === true) continue;
                      if (manifest.version !== version) {
                          throw new Error(
                              `${manifest.name} is version ${manifest.version}, but the tag is v${version}`,
                          );
                      }
                  }
                  NODE

                  if [[ "$GITHUB_REF_NAME" == *-* ]]; then
                      echo "npm-tag=next" >> "$GITHUB_OUTPUT"
                      echo "prerelease=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
                      echo "prerelease=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build
              run: pnpm run build

            - name: Publish packages to npm
              run: >-
                  pnpm publish
                  --recursive
                  --access public
                  --provenance
                  --tag "${{ steps.release.outputs.npm-tag }}"
                  --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    release:
        if: github.repository == 'infini-scroll/infini'
        name: Create GitHub Release
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Create release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  options=(
                      "$GITHUB_REF_NAME"
                      --verify-tag
                      --generate-notes
                      --title "$GITHUB_REF_NAME"
                  )
                  if [[ "$GITHUB_REF_NAME" == *-* ]]; then
                      options+=(--prerelease)
                  fi
                  gh release create "${options[@]}"
