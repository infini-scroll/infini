[package]
name = "infini-wasm"
version = "0.1.0"
edition = "2021"
description = "Infini engine wasm glue"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
infini-core = { path = "../infini-core" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
