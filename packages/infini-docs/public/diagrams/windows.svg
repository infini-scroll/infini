<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Infini windows and retained data</title>
  <desc id="desc">The visible window sits inside the larger layout window. Resident items extend beyond layout, and buffer items are retained outside resident.</desc>
  <defs>
    <style>
      .label{font:600 16px ui-sans-serif,system-ui,sans-serif;fill:#29263b}
      .small{font:13px ui-sans-serif,system-ui,sans-serif;fill:#68637c}
      .line{stroke:#514b69;stroke-width:1.5}
    </style>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ece9f8"/>
      <stop offset=".5" stop-color="#fff"/>
      <stop offset="1" stop-color="#e5f5f1"/>
    </linearGradient>
  </defs>
  <rect width="920" height="430" rx="24" fill="#faf9fd"/>
  <text x="52" y="48" class="label">Pixel windows</text>
  <rect x="52" y="70" width="816" height="122" rx="14" fill="url(#surface)" stroke="#d9d4e8"/>
  <rect x="242" y="84" width="448" height="94" rx="11" fill="#dcd6fa" stroke="#7a66e5" stroke-width="2"/>
  <rect x="354" y="97" width="224" height="68" rx="9" fill="#6955d9"/>
  <text x="466" y="126" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="white">Visible</text>
  <text x="466" y="148" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#eeeaff">what the user can see</text>
  <text x="466" y="212" text-anchor="middle" class="label">Layout</text>
  <text x="466" y="232" text-anchor="middle" class="small">mounted + measured pixel overscan</text>
  <path d="M242 202v18h92" fill="none" class="line"/>
  <path d="M690 202v18h-92" fill="none" class="line"/>
  <text x="52" y="276" class="label">Known item ranges</text>
  <g transform="translate(52 298)">
    <rect width="816" height="76" rx="13" fill="#f0eef5" stroke="#d9d4e8"/>
    <rect x="92" y="10" width="632" height="56" rx="10" fill="#dff2ed" stroke="#4da58e"/>
    <rect x="208" y="20" width="400" height="36" rx="8" fill="#a9dfd2"/>
    <g stroke="#fff" stroke-width="2">
      <path d="M258 20v36M308 20v36M358 20v36M408 20v36M458 20v36M508 20v36M558 20v36"/>
    </g>
    <text x="46" y="44" text-anchor="middle" class="small">Buffer</text>
    <text x="770" y="44" text-anchor="middle" class="small">Buffer</text>
    <text x="150" y="44" text-anchor="middle" class="small">Resident</text>
    <text x="666" y="44" text-anchor="middle" class="small">Resident</text>
    <text x="408" y="44" text-anchor="middle" class="label">Layout items</text>
  </g>
  <text x="460" y="405" text-anchor="middle" class="small">Layout is measured in pixels; Resident and Buffer describe retained items.</text>
</svg>
